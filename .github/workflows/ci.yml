name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm -w run typecheck

      - name: Lint
        run: pnpm -w run lint

      - name: Build plugin companion
        run: pnpm --filter agent-plugin-cc run build

      - name: Run tests
        run: pnpm -w run test

      - name: Paperclip-free check (ADPT-01)
        run: |
          cd packages/runtime
          PACK_OUTPUT=$(pnpm pack --dry-run 2>&1)
          echo "$PACK_OUTPUT"
          if echo "$PACK_OUTPUT" | grep -i "paperclip"; then
            echo "ERROR: paperclip reference found in runtime pack output"
            exit 1
          fi
          echo "OK: runtime package has no paperclip references"

          cd ../plugin
          PACK_OUTPUT=$(pnpm pack --dry-run 2>&1)
          echo "$PACK_OUTPUT"
          if echo "$PACK_OUTPUT" | grep -i "paperclip"; then
            echo "ERROR: paperclip reference found in plugin pack output"
            exit 1
          fi
          echo "OK: plugin package has no paperclip references"

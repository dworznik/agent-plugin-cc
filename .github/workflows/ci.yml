name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build runtime
        run: pnpm --filter @agent-plugin-cc/runtime run build

      - name: TypeScript typecheck
        run: pnpm -w run typecheck

      - name: Lint
        run: pnpm -w run lint

      - name: Build plugin companion
        run: pnpm --filter agent-plugin-cc run build

      - name: Run tests
        run: pnpm -w run test

      - name: Paperclip-free check (ADPT-01)
        run: |
          for pkg in packages/runtime packages/plugin; do
            echo "Checking $pkg..."
            TARBALL=$(cd "$pkg" && pnpm pack --pack-destination /tmp 2>&1 | tail -1)
            tar tzf "$TARBALL" > /tmp/pack-files.txt
            if grep -i "paperclip" /tmp/pack-files.txt; then
              echo "ERROR: paperclip reference found in $pkg pack output"
              exit 1
            fi
            rm -f "$TARBALL"
            echo "OK: $pkg has no paperclip references"
          done
